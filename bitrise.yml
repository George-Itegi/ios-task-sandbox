# Bitrise CI — macOS verification sandbox (Cirrus CI successor).
#
# Why Bitrise: Cirrus CI shut down permanently on 2026-06-01 (team joined
# OpenAI). Bitrise offers its paid Developer Plan features FREE for PUBLIC
# repositories (1 concurrent build, max 45 min per build, macOS stacks with
# current Xcode) — no payment method required.
#
# Workflows:
#   primary            -> FULL rehearsal of freeotp-ios: build -> boot simulator
#                         -> install -> launch -> screenshot. Runs automatically
#                         on the first build / any push to main.
#   qualify_freeotp, qualify_productivity, qualify_expense
#                      -> build-only qualification of a target repo. Start
#                         manually: Dashboard -> Start Build -> select workflow.
#
# Reuses scripts/qualify.sh and scripts/smoke-rehearsal.sh — the same logic
# that will run on GitHub Actions once the billing lock is lifted.

format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  primary:
    steps:
      - script@1:
          title: Smoke: freeotp-ios build + install + launch
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=FreeOTP
                bash scripts/smoke-rehearsal.sh https://github.com/freeotp/freeotp-ios

  qualify_freeotp:
    steps:
      - script@1:
          title: Qualify: freeotp-ios (build only)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/freeotp/freeotp-ios

  qualify_productivity:
    steps:
      - script@1:
          title: Qualify: Productivity-Pro (build only)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/stoobit/Productivity-Pro

  qualify_expense:
    steps:
      - script@1:
          title: Qualify: Expense-Tracker-App (build only)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/abdorizak/Expense-Tracker-App
