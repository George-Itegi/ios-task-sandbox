format_version: '25'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
meta:
  bitrise.io:
    stack: osx-xcode-26.6.x
    machine_type: standard
    machine_type_id: g2.mac.large
workflows:
  primary:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Smoke: freeotp-ios build + install + launch"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=FreeOTP
                bash scripts/smoke-rehearsal.sh https://github.com/freeotp/freeotp-ios
                if [ -d artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
                  cp -R artifacts/. "$BITRISE_DEPLOY_DIR"/
                fi
      - deploy-to-bitrise-io@2: {}
  qualify_freeotp:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: freeotp-ios (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/freeotp/freeotp-ios
  qualify_productivity:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: Productivity-Pro (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/stoobit/Productivity-Pro
  qualify_expense:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: Expense-Tracker (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/abdorizak/Expense-Tracker-App
  rescue_freeotp:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Rescue: freeotp carthage bootstrap + build"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                echo "== Carthage availability =="
                command -v carthage && carthage version || {
                  echo "carthage not preinstalled - installing via brew"
                  brew install carthage
                }
                git clone https://github.com/freeotp/freeotp-ios target
                cd target
                echo "== Fetch declared deps (Cartfile.resolved pins versions) =="
                carthage bootstrap --platform iOS --use-xcframeworks 2>&1 || carthage bootstrap --platform iOS
                ls -la Carthage/Build/ || true
                echo "== Build freeotp with frameworks restored =="
                xcodebuild build -project FreeOTP.xcodeproj -scheme FreeOTP \
                  -destination 'generic/platform=iOS Simulator' \
                  -skipMacroValidation -skipPackagePluginValidation \
                  -derivedDataPath /tmp/rescue-dd \
                  COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
                echo "RESULT: FREEOTP RESCUE BUILD OK — viable with vendored frameworks"
