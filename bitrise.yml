format_version: '25'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
meta:
  bitrise.io:
    stack: osx-xcode-26.6.x
    machine_type: standard
    machine_type_id: g2.mac.large
workflows:
  primary:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Smoke: ExcalidrawZ build + install + launch"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=ExcalidrawZ
                unset PATCH_SCRIPT 2>/dev/null || true
                bash scripts/smoke-rehearsal.sh https://github.com/chocoford/ExcalidrawZ
                if [ -d artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
                  cp -R artifacts/. "$BITRISE_DEPLOY_DIR"/
                fi
      - deploy-to-bitrise-io@2: {}
  qualify_emoncms:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: emoncms-ios (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=EmonCMSiOS
                bash scripts/qualify.sh https://github.com/emoncms/emoncms-ios
  qualify_emoncms_diag:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Diag: emoncms-ios with Charts unlocked to 4.1.0"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/diagnose_emoncms.sh
  qualify_excalidraw:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: ExcalidrawZ (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/chocoford/ExcalidrawZ
  qualify_excalidraw_2024:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: ExcalidrawZ @ a7631da (Sep 2024, web bundle committed)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=ExcalidrawZ
                bash scripts/qualify.sh https://github.com/chocoford/ExcalidrawZ a7631da
  qualify_totp:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: DaDaIkSeon TOTP (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/boostcamp-2020/Project03-A-TOTP
  rehearse_emoncms:
    steps:
    - git-clone@8: {}
    - script@1:
        title: 'Matrix: emoncms trim task — unsolved FAIL / solved PASS'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            REF=9c25a81b688eac13089188df11877b2ceed13434
            rm -rf legA legB
            git clone --quiet https://github.com/emoncms/emoncms-ios legA
            git -C legA checkout --quiet $REF
            git clone --quiet https://github.com/emoncms/emoncms-ios legB
            git -C legB checkout --quiet $REF

            echo "== LEG A: unsolved repo — check must FAIL =="
            if bash scripts/emoncms_check.sh legA; then
              echo "MATRIX BROKEN: check passed on unsolved repo"; exit 1
            else
              echo "LEG A OK: check failed as required"
            fi

            echo "== LEG B: solved repo — check must PASS =="
            bash scripts/emoncms_apply_solution.sh legB
            bash scripts/emoncms_check.sh legB
            echo "LEG B OK: check passed on solved repo"
            echo "MATRIX RESULT: PASS (unsolved fail / solved pass)"
    - script@1:
        title: 'Full smoke: solved emoncms (pins fix + solution) build + install + launch'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            export SCHEME=EmonCMSiOS
            export PATCH_SCRIPT=scripts/emoncms_smoke_patch.sh
            bash scripts/smoke-rehearsal.sh https://github.com/emoncms/emoncms-ios 9c25a81b688eac13089188df11877b2ceed13434
            if [ -d artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
              cp -R artifacts/. "$BITRISE_DEPLOY_DIR"/
            fi
    - deploy-to-bitrise-io@2: {}
  smoke_excalidraw_2024:
    steps:
    - git-clone@8: {}
    - script@1:
        title: 'Smoke: ExcalidrawZ @ 8355c75 + iOS guards (build+install+launch)'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            export SCHEME=ExcalidrawZ
            export PATCH_SCRIPT=scripts/fix_excalidraw_ios_guards.sh
            bash scripts/smoke-rehearsal.sh https://github.com/chocoford/ExcalidrawZ 8355c755ca2dcbcae3d39f36b85a841b4d5900da
            if [ -d artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
              cp -R artifacts/. "$BITRISE_DEPLOY_DIR"/
            fi
    - deploy-to-bitrise-io@2: {}
  rehearse_excalidraw_task2:
    steps:
    - git-clone@8: {}
    - script@1:
        title: 'Matrix: task2 ExcalidrawZ @ 8355c75 — unsolved FAIL / solved PASS'
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            REF=8355c755ca2dcbcae3d39f36b85a841b4d5900da
            rm -rf legA legB task2-artifacts
            export ARTIFACTS="$PWD/task2-artifacts"
            mkdir -p "$ARTIFACTS"
            git clone --quiet https://github.com/chocoford/ExcalidrawZ legA
            git -C legA checkout --quiet $REF
            git clone --quiet https://github.com/chocoford/ExcalidrawZ legB
            git -C legB checkout --quiet $REF

            UDID="$(xcrun simctl list devices available | grep -m1 -o '[0-9A-F-]\{36\}' || true)"
            if [ -z "$UDID" ]; then
              DEVTYPE="$(xcrun simctl list devicetypes | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone[^(]*' | tail -1 | sed 's/[[:space:]]*$//')"
              RUNTIME="$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1)"
              UDID="$(xcrun simctl create rehearse-t2 "$DEVTYPE" "$RUNTIME")"
            fi
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            export UDID

            echo "== LEG A: unsolved — check must FAIL at target 1 (build) =="
            set +e
            OUT_A="$(bash checks/task2-check.sh "$PWD/legA" 2>&1)"
            RC_A=$?
            set -e
            echo "$OUT_A" | tail -3
            if [ $RC_A -eq 0 ]; then
              echo "MATRIX BROKEN: check passed on unsolved repo"; exit 1
            fi
            echo "$OUT_A" | grep -q "target 1" || { echo "MATRIX BROKEN: unsolved failed for the wrong reason"; exit 1; }
            echo "LEG A OK: failed at target 1 as required"

            echo "== LEG B: solved — check must PASS =="
            WORKSPACE="$PWD/legB" bash scripts/task2-solve.sh > /dev/null
            set +e
            OUT_B="$(bash checks/task2-check.sh "$PWD/legB" 2>&1)"
            RC_B=$?
            set -e
            echo "$OUT_B" | tail -5
            if [ $RC_B -ne 0 ]; then
              echo "MATRIX BROKEN: solved tree failed the check"; exit 1
            fi
            echo "LEG B OK: solved tree passed the check"
            echo "MATRIX RESULT: PASS (unsolved fail at target 1 / solved pass)"
            if [ -d task2-artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
              mkdir -p "$BITRISE_DEPLOY_DIR/task2-artifacts"
              cp -R task2-artifacts/. "$BITRISE_DEPLOY_DIR/task2-artifacts"/
            fi
    - deploy-to-bitrise-io@2: {}
