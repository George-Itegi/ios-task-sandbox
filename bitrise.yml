format_version: '25'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other
meta:
  bitrise.io:
    stack: osx-xcode-26.6.x
    machine_type: standard
    machine_type_id: g2.mac.large
workflows:
  primary:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Smoke: emoncms-ios build + install + launch"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=EmonCMSiOS
                bash scripts/smoke-rehearsal.sh https://github.com/emoncms/emoncms-ios
                if [ -d artifacts ] && [ -n "${BITRISE_DEPLOY_DIR:-}" ]; then
                  cp -R artifacts/. "$BITRISE_DEPLOY_DIR"/
                fi
      - deploy-to-bitrise-io@2: {}
  qualify_emoncms:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: emoncms-ios (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                export SCHEME=EmonCMSiOS
                bash scripts/qualify.sh https://github.com/emoncms/emoncms-ios
  qualify_excalidraw:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: ExcalidrawZ (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/chocoford/ExcalidrawZ
  qualify_totp:
    steps:
      - git-clone@8: {}
      - script@1:
          title: "Qualify: DaDaIkSeon TOTP (build only)"
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash scripts/qualify.sh https://github.com/boostcamp-2020/Project03-A-TOTP
