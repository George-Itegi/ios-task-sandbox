# Cirrus CI — macOS verification sandbox
# Free OSS compute for this PUBLIC repository. No billing, no payment method.
#
# HOW TO TRIGGER (no cirrus-ci.com browser access required):
#   - Every push to any branch  -> "Probe macOS image" runs automatically.
#   - Push main to a branch named `qualify`  -> 3 repo qualifiers + the full
#     build/install/launch smoke run, all in parallel macOS VMs:
#       git push origin main:refs/heads/qualify
#
# Image pinned to Xcode 26.3 = exact match with the expert platform
# (iPhone 17 Pro / iOS 26.3 / Swift 6.2 toolchain).

probe_task:
  name: Probe macOS image (Xcode 26.3)
  macos_instance:
    image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  script:
    - sw_vers
    - xcodebuild -version
    - ls /Applications | grep -i xcode
    - xcrun simctl list runtimes | grep iOS
    - xcrun simctl list devices available | head -20

qualify_freeotp_task:
  name: "Qualifier: freeotp-ios"
  only_if: $CIRRUS_BRANCH == 'qualify'
  timeout_in: 45
  macos_instance:
    image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  script:
    - bash scripts/qualify.sh https://github.com/freeotp/freeotp-ios

qualify_productivity_task:
  name: "Qualifier: Productivity-Pro"
  only_if: $CIRRUS_BRANCH == 'qualify'
  timeout_in: 45
  macos_instance:
    image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  script:
    - bash scripts/qualify.sh https://github.com/stoobit/Productivity-Pro

qualify_expense_task:
  name: "Qualifier: Expense-Tracker-App"
  only_if: $CIRRUS_BRANCH == 'qualify'
  timeout_in: 45
  macos_instance:
    image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  script:
    - bash scripts/qualify.sh https://github.com/abdorizak/Expense-Tracker-App

smoke_freeotp_task:
  name: "Smoke: freeotp-ios build + install + launch"
  only_if: $CIRRUS_BRANCH == 'qualify'
  timeout_in: 45
  macos_instance:
    image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  env:
    SCHEME: FreeOTP
  script:
    - bash scripts/smoke-rehearsal.sh https://github.com/freeotp/freeotp-ios
